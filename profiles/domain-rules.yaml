mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat"
  geoip: "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat"
  mmdb: "https://git.io/GeoLite2-Country.mmdb"

dns:
  enabled: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
  nameserver:
    - https://dns.adguard-dns.com/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: false
    ipcidr:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 192.168.0.0/16
  proxy-server-nameserver:
    - https://dns.adguard-dns.com/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53

proxy-providers:
  VPN-PROVIDER:
    type: file
    path: ./proxies.yaml
    interval: 0

proxy-groups:
  - name: VPN
    type: select
    use:
      - VPN-PROVIDER

rule-providers:
  direct-domains:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/eyamilov/clash-conf/main/rules/direct.yaml
    path: ./ruleset/direct.yaml
    interval: 86400
  misc-domains:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/eyamilov/clash-conf/main/rules/misc.yaml
    path: ./ruleset/misc.yaml
    interval: 86400

rules:
  - PROCESS-NAME,Discord.exe,VPN
  - PROCESS-NAME,Telegram.exe,VPN
  - PROCESS-NAME,WhatsApp.exe,VPN

  - RULE-SET,direct-domains,DIRECT
  - RULE-SET,misc-domains,VPN

  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  - GEOSITE,telegram,VPN
  - GEOIP,telegram,VPN,no-resolve
  - GEOSITE,youtube,VPN
  - GEOSITE,signal,VPN
  - GEOSITE,instagram,VPN
  - GEOSITE,facebook,VPN
  - GEOSITE,whatsapp,VPN
  - GEOSITE,meta,VPN
  - GEOIP,facebook,VPN,no-resolve
  - GEOSITE,discord,VPN
  - GEOSITE,speedtest,VPN
  - GEOSITE,roblox,VPN
  - GEOSITE,ru-blocked,VPN
  - GEOIP,ru-blocked,VPN,no-resolve

  - MATCH,DIRECT
